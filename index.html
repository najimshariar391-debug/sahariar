<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ede7f6;
            text-align: center;
            padding: 50px 15px;
        }
        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #5b4bdb;
        }
        button {
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-green { background: #28a745; }
        .btn-blue { background: #007bff; margin-top: 15px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="box">
        <h1>স্বাগতম আমার ওয়েবসাইটে!</h1>
        
        <!-- ডিজিটাল ঘড়ি -->
        <div style="font-family: 'Courier New', Courier, monospace; background: #222; color: #00ff00; padding: 15px; font-size: 30px; font-weight: bold; text-align: center; border-radius: 10px; margin: 20px 0;">
            <span id="clock">00:00:00 PM</span>
        </div>

        <!-- লটারি মেকার -->
        <div style="background: #f9f9f9; border: 2px dashed #5b4bdb; padding: 15px; border-radius: 10px; margin-top: 20px;">
            <h3 style="margin-top: 0;">🎲 লাকি নাম্বার লটারি 🎲</h3>
            <button class="btn-green" onclick="pickWinner()">নম্বর তুলুন</button>
            <h1 id="winnerNumber" style="color: #dc3545; font-size: 40px; margin: 10px 0 0 0;">--</h1>
        </div>

        <!-- কোটস জেনারেটর -->
        <div style="background: #fff3cd; border: 1px solid #ffeeba; padding: 20px; border-radius: 10px; margin-top: 25px;">
            <h3 style="margin-top: 0; color: #856404;">💡 আজকের অনুপ্রেরণা 💡</h3>
            <p id="quoteDisplay" style="font-size: 18px; font-style: italic; color: #333; min-height: 50px; margin: 15px 0;">"বাটনটিতে ক্লিক করে একটি সুন্দর উক্তি পড়ুন।"</p>
            <button class="btn-blue" onclick="getNewQuote()">নতুন উক্তি দেখুন</button>
        </div>
    </div>

    <!-- জাভাস্ক্রিপ্ট কোড -->
    <script>
        // ১. ঘড়ির ফাংশন
        function showTime() {
            let date = new Date();
            let h = date.getHours(); 
            let m = date.getMinutes(); 
            let s = date.getSeconds(); 
            let session = "AM";
            
            if (h == 0) { h = 12; }
            if (h > 12) { h = h - 12; session = "PM"; }
            
            h = (h < 10) ? "0" + h : h;
            m = (m < 10) ? "0" + m : m;
            s = (s < 10) ? "0" + s : s;
            
            let time = h + ":" + m + ":" + s + " " + session;
            document.getElementById("clock").innerText = time;
            
            setTimeout(showTime, 1000);
        }
        showTime();

        // ২. লটারির ফাংশন
        function pickWinner() {
            let luckyNumber = Math.floor(Math.random() * 100) + 1;
            document.getElementById("winnerNumber").innerText = luckyNumber;
        }

        // ৩. কোটস জেনারেটরের ফাংশন
        const quotes = [
            "আজকের দিনটি আপনার জীবনের সেরা দিনগুলোর একটি হতে পারে, চেষ্টা করতে থাকুন।",
            "সাফল্যের কোনো গোপন মন্ত্র নেই, এটি হলো প্রস্তুতি, কঠোর পরিশ্রম আর ব্যর্থতা থেকে শেখার ফল।",
            "যদি তুমি সত্যি কিছু করতে চাও তবে পথ খুঁজে পাবে, আর যদি না চাও তবে অজুহাত খুঁজে পাবে।",
            "ভুল করা মানুষ হওয়া বন্ধ করো না, বরং ভুল থেকে শিখে আরও উন্নত মানুষ হও।",
            "কখনও হাল ছেড়ো না! আজকের দিনটি কঠিন, কাল হয়তো আরও কঠিন হবে, কিন্তু পরশু নতুন সূর্য উঠবেই।",
            "অন্যের মতো হওয়ার চেষ্টা করার চেয়ে নিজের সেরা সংস্করণ হওয়া অনেক ভালো।"
        ];

        function getNewQuote() {
            let randomNumber = Math.floor(Math.random() * quotes.length);
            document.getElementById("quoteDisplay").innerText = quotes[randomNumber];
        }
    </script>

</body>
</html>
