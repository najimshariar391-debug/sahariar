<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e0e7ff;
            text-align: center;
            padding: 50px 15px;
        }

        .box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: #5b4bdb;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid gray;
        }

        button {
            background: #5b4bdb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Welcome to My Website!</h1>
        <p>This is my first website.</p>

        <input id="name" type="text" placeholder="Enter your name">
        <br>

        <button onclick="welcome()">Click Me</button>

        <p id="message"></p>
    </div>

    <script>
        function welcome() {
            let name = document.getElementById("name").value.trim();

            if (name === "") {
                document.getElementById("message").textContent =
                    "Please enter your name!";
            } else {
                document.getElementById("message").textContent =
                    "Welcome, " + name + "!";
            }
        }
    </script>
</body>
</html>
